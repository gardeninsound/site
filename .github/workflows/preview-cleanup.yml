name: Preview cleanup

# When a pull request closes (merged or not), its preview is re-uploaded with a small "this
# preview has closed" page (preview/closed/), so old previews don't linger as copies of the
# site. Cloudflare has no command to delete a preview alias; uploading over it is the
# documented way to change what it shows. Its GitHub deployments are also marked inactive.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false # let a last preview upload finish first, then close it

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Without the Cloudflare token there was no preview
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret, so there's no preview to close."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v6
        with:
          sparse-checkout: preview
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
        working-directory: preview

      - name: Replace the preview with the "closed" page
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: preview
        run: >-
          npx wrangler versions upload
          --assets ./closed
          --preview-alias "pr-${{ github.event.pull_request.number }}"
          --message "PR #${{ github.event.pull_request.number }} closed"

      - name: Mark its deployments inactive
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=preview&ref=$BRANCH&per_page=100" -q '.[].id'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive -q .state
          done
